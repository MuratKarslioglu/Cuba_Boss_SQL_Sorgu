# Bagimliliklar requirements*.txt dosyalarinda tutulur.
# Bu dosya yalnizca arac konfigurasyonu icindir; build backend tanimlamaz.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: spec §6 enum'lari birebir `(str, Enum)` olarak tanimlar.
# StrEnum'a gecmek spec sozlesmesinden sapma olurdu.
ignore = ["UP042"]
